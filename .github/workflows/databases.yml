name: Database compatibility
on:
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - 'Dockerfile'
      - 'compose*.yaml'
      - '.env.example'
      - 'scripts/test-databases.mts'
      - '.github/workflows/databases.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run test:database
