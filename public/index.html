<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f0"><meta name="description" content="코드가 자라는 동안, 작은 친구도 함께 자라요. Claude와 Codex가 함께하는 픽셀 펫 작업실.">
  <title>TokenPet — 작은 친구들의 작업실</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='12' width='20' height='16' rx='6' fill='%239bb97c'/%3E%3Cpath d='M16 12V6M16 8L10 4M16 8L22 2' stroke='%233e6042' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css"><script type="module" src="/app.js"></script>
</head>
<body>
  <a href="#main" class="skip">본문 바로가기</a>
  <aside class="sidebar">
    <a class="brand" href="/" aria-label="TokenPet 작업실 홈"><span class="brand-leaf">✳</span> TokenPet<span class="brand-dot">.</span></a>
    <span class="brand-sub">YOUR LITTLE CODING COMPANY</span>
    <div class="workspace-label">MY WORKSPACE</div>
    <nav aria-label="작업실 메뉴">
      <button data-tab="home" class="nav active" aria-label="나의 작업실"><span>⌂</span> 나의 작업실 <span class="nav-dot"></span></button>
      <button data-tab="dex" class="nav" aria-label="친구 도감"><span>▦</span> 친구 도감 <small id="nav-count">0</small></button>
      <button data-tab="ranking" class="nav" aria-label="친구 랭킹"><span>♧</span> 친구 랭킹</button>
      <button data-tab="hatch" class="nav" aria-label="알 부화소"><span>◇</span> 알 부화소</button>
      <button data-tab="connect" class="nav" aria-label="CLI 연동"><span>⌘</span> CLI 연동</button>
    </nav>
    <div class="sidebar-note"><span class="tiny-spark">✦</span><p>작은 코드가 모여<br>커다란 우정이 되니까.</p><span>MAKE SOMETHING. GROW TOGETHER.</span></div>
    <div class="sidebar-bottom"><i class="live-dot"></i><span id="server-label">작업실 연결 중</span></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div><span class="breadcrumb">WORKSPACE</span><span class="slash">/</span><span id="workspace-name">나의 작은 작업실</span></div><div class="top-actions"><span class="coin-balance"><span>✦</span><b id="coins">—</b><small>COINS</small></span><button class="avatar" id="profile-button" aria-label="작업실 이름 변경">M</button></div></header>
    <main id="main"><div class="loading">작은 친구가 작업실 문을 열고 있어요…</div></main>
    <footer><span>BUILT WITH TOKENS, RAISED WITH LOVE.</span><span>조금 쉬어 가도 괜찮아요. 친구는 여기 있을게요.</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="modal"><button class="dialog-close" aria-label="닫기">×</button><div id="modal-content"></div></dialog>
</body></html>
